name: LOTIEM receiver checks

on:
  push:
    branches:
      - feature/receiver-service
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile receiver
        run: python -m compileall -q lotiem run_lotiem.py
      - name: Run receiver tests
        run: python -m unittest discover -s tests -v
